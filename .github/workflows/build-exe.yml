
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AffidavitMaker affidavit_maker.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AffidavitMaker-Windows-EXE
          path: dist/AffidavitMaker.exe
